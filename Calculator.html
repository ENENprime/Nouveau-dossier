<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <header>
            <nav>
                <a href="index.html">Get to english paper</a>
                <a href="index_fr.html">Retour en français </a>  
            </nav>
    </header>        
    <body>
        <iframe src="timer.html" width="100%" height="200px"></iframe>
        <a href="timer.html">TIME</a>
        <marquee scrollamount="15">
        <h1> Here is your main Amor so get to work!</h1>
        <article>
        
        <div id="calculator">
            <input id="display" readonly>
            <div id="keys">
                <button onclick="appendToDisplay('+')" class="operator-btn">+</button>
                <button onclick="appendToDisplay('7')">7</button>
                <button onclick="appendToDisplay('8')">8</button>   
                <button onclick="appendToDisplay('9')">9</button>
                <button onclick="appendToDisplay('-')" class="operator-btn">-</button>
                <button onclick="appendToDisplay('4')">4</button>
                <button onclick="appendToDisplay('5')">5</button>
                <button onclick="appendToDisplay('6')">6</button>
                <button onclick="appendToDisplay('*')" class="operator-btn">*</button>
                <button onclick="appendToDisplay('1')">1</button>
                <button onclick="appendToDisplay('2')">2</button>
                <button onclick="appendToDisplay('3')">3</button>
                <button onclick="appendToDisplay('/')" class="operator-btn">/</button>
                <button onclick="appendToDisplay('0')">0</button>
                <button onclick="appendToDisplay('.')">.</button>
                <button onclick="calculateResult()" class="operator-btn">=</button>
                <button onclick="clearDisplay()" class="operator-btn">Del</button>


            </div>
        </div>
        <script src="script.js"></script>
    </article>
        </marquee>
    </body>
</html>
